<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redbegins OS - Proyectos</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <style>
        body {
            background-color: #008080;
            margin: 0;
            overflow: hidden;
            font-family: 'Pixelated MS Sans Serif', Arial, sans-serif;
            height: 100vh;
            /* Fondo de nubes opcional para seguir tu estética */
            background-image: url('https://w98.ms/cloud.jpg'); 
            background-size: cover;
        }

        #desktop {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 80px);
            grid-gap: 20px;
            height: calc(100vh - 40px);
        }

        .desktop-icon {
            width: 70px;
            text-align: center;
            color: white;
            cursor: pointer;
            text-shadow: 1px 1px #000;
        }

        .desktop-icon img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }

        /* VENTANAS MEJORADAS */
        .window {
            position: absolute;
            display: none;
            min-width: 250px;
            min-height: 150px;
            /* Esto permite redimensionar desde la esquina */
            resize: both;
            overflow: auto; 
            z-index: 10;
        }

        .title-bar {
            cursor: grab; /* Indica que se puede mover */
        }

        .title-bar:active {
            cursor: grabbing;
        }

        .window-body {
            height: calc(100% - 40px); /* Ajuste para que el contenido llene la ventana */
            overflow: auto;
        }

        /* Posiciones iniciales */
        #folder-window { top: 10%; left: 10%; width: 450px; height: 300px; }
        #player-window { top: 20%; left: 50%; width: 320px; height: 180px; }

        .file-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: white;
            border: inset 2px;
            padding: 10px;
            min-height: 100px;
        }
    </style>
</head>
<body>

    <div id="desktop">
        <div class="desktop-icon" ondblclick="openWindow('folder-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/directory_closed-4.png">
            <div>Mis IDs</div>
        </div>
        <div class="desktop-icon" ondblclick="openWindow('player-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/cd_audio_cd_a-3.png">
            <div>Winamp</div>
        </div>
    </div>

    <div class="window" id="folder-window">
        <div class="title-bar">
            <div class="title-bar-text">C:\Productores\Redbegins\IDs</div>
            <div class="title-bar-controls">
                <button aria-label="Close" onclick="closeWindow('folder-window')"></button>
            </div>
        </div>
        <div class="window-body">
            <div class="file-grid">
                <div class="desktop-icon" style="color:black; text-shadow:none;">
                    <img src="https://win98icons.alexmeub.com/icons/png/audio_file-0.png">
                    <div style="font-size: 10px;">ID_Neuro_01.wav</div>
                </div>
            </div>
        </div>
    </div>

    <div class="window" id="player-window">
        <div class="title-bar">
            <div class="title-bar-text">Media Player</div>
            <div class="title-bar-controls">
                <button aria-label="Close" onclick="closeWindow('player-window')"></button>
            </div>
        </div>
        <div class="window-body" style="background: #000; color: #0f0; padding: 10px;">
            <p style="font-size: 12px;">NOW PLAYING: DnB_Track_01</p>
            <audio controls style="width: 100%;">
                <source src="#" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <script>
        let highestZ = 10;

        function openWindow(id) {
            const win = document.getElementById(id);
            win.style.display = 'block';
            focusWindow(win);
        }

        function closeWindow(id) {
            document.getElementById(id).style.display = 'none';
        }

        function focusWindow(win) {
            highestZ++;
            win.style.zIndex = highestZ;
        }

        // LÓGICA PARA ARRASTRAR (DRAG)
        document.querySelectorAll('.window').forEach(win => {
            const titleBar = win.querySelector('.title-bar');
            
            win.addEventListener('mousedown', () => focusWindow(win));

            titleBar.onmousedown = function(e) {
                // No mover si se hace clic en los botones de cerrar
                if (e.target.tagName === 'BUTTON') return;

                let shiftX = e.clientX - win.getBoundingClientRect().left;
                let shiftY = e.clientY - win.getBoundingClientRect().top;

                function moveAt(pageX, pageY) {
                    win.style.left = pageX - shiftX + 'px';
                    win.style.top = pageY - shiftY + 'px';
                }

                function onMouseMove(event) {
                    moveAt(event.pageX, event.pageY);
                }

                document.addEventListener('mousemove', onMouseMove);

                document.onmouseup = function() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.onmouseup = null;
                };
            };

            // Prevenir drag nativo de imágenes dentro de la barra
            titleBar.ondragstart = function() { return false; };
        });
    </script>
</body>
</html>
